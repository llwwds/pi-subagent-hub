name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: vendor/pi-runtime.package-lock.json
      - run: npm run check
      - run: npm run bootstrap:pi
      - run: npm run smoke:pi
